name: Update Google Scholar statistics manually

on:
  workflow_dispatch:
    inputs:
      publications:
        description: "Number of publications shown on Google Scholar"
        required: true
        type: string
      citations:
        description: "Total citations shown on Google Scholar"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: scholar-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the homepage
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Scholar statistics from the submitted values
        run: >-
          python scripts/update_scholar_stats.py
          --publications "${{ inputs.publications }}"
          --citations "${{ inputs.citations }}"

      - name: Commit updated values
        run: |
          if git diff --quiet -- index.html; then
            echo "Scholar statistics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Google Scholar statistics"
          git push
